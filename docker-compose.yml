services:
  postgres:
    image: postgres:16-alpine
    container_name: libris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: libris
      POSTGRES_USER: libris
      POSTGRES_PASSWORD: libris_dev_password
    ports: ["5432:5432"]
    volumes: [libris_pgdata:/var/lib/postgresql/data]
volumes:
  libris_pgdata:
