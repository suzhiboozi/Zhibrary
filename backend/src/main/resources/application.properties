server.port=8080

# Easiest local setup: file-backed H2. Data survives restarts in backend/data.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/libris;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.application.name=Libris

# Optional Supabase/PostgreSQL setup: set DB_URL, DB_USER, DB_PASSWORD and restart.

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
